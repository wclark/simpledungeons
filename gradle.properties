# Sets default memory used for Gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=true

# Environment Properties
# Latest stable Minecraft Java release confirmed from Mojang's version manifest.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]

# The NeoForge version must agree with the Minecraft version to get a valid artifact.
# Latest matching artifact confirmed from NeoForge Maven metadata.
neo_version=26.1.2.45-beta

## Mod Properties
mod_id=simpledungeons
mod_name=Simple Dungeons
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=com.github.wclark.simpledungeons
